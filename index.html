<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rappi AI Assistant — Evolution Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040302;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.12);
  --line-strong:rgba(255,255,255,.22);
  --ink:#ffffff;
  --ink-2:rgba(255,255,255,.74);
  --ink-3:rgba(255,255,255,.54);
  --ink-4:rgba(255,255,255,.38);
  --accent:#FF6B46;
  --accent-ink:#FF9270;
  --accent-soft:rgba(255,107,70,.14);
  --accent-line:rgba(255,107,70,.42);
  --live:#3ED991;
  --closing:#B9A8FF;
  --nav-h:57px;
  --font:'PP Object Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  position:relative;
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-size:15px;
  line-height:1.5;
}
body:before,body:after{content:'';position:fixed;inset:0;pointer-events:none}
body:before{background:radial-gradient(120% 56% at 12% -12%, rgba(255,107,70,.34), rgba(255,107,70,0) 62%)}
body:after{background:radial-gradient(85% 46% at 106% 108%, rgba(126,94,255,.24), rgba(126,94,255,0) 66%)}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
@media(max-width:760px){.wrap{padding:0 20px}}

/* ---------- NAV ---------- */
.nav{
  position:sticky;top:0;z-index:50;
  height:var(--nav-h);
  background:rgba(4,3,2,.62);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.nav-in{height:100%;display:flex;align-items:center;gap:36px}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand-mark{width:19px;height:19px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center}
.brand-mark svg{width:11px;height:11px;fill:var(--accent)}
.brand-name{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.nav-meta{margin-left:auto;flex:none;font-size:12px;color:var(--ink-4);letter-spacing:.01em}
@media(max-width:900px){.nav-meta{display:none}}

/* ---------- HERO ---------- */
.hero{padding:40px 0 34px;border-bottom:1px solid var(--line);text-align:center}
.hero h1{
  margin:0 auto;
  font-size:30px;line-height:1.1;letter-spacing:-.03em;font-weight:700;
  white-space:nowrap;
}
.hero-copy{margin:14px auto 0;font-size:14px;color:var(--ink-3);max-width:52ch;line-height:1.5}
@media(max-width:760px){.hero h1{white-space:normal}}
@media(max-width:600px){.hero h1{font-size:24px}}

/* ---------- TIMELINE ---------- */
.tl-sec{padding:34px 0 8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:26px}
.sec-title{font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4)}
.tl-scroll{overflow-x:visible;padding-bottom:12px;margin:0 -4px;padding-left:4px;padding-right:4px}
.tl-track{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;padding-top:44px}
@media(max-width:900px){
  .tl-scroll{overflow-x:auto;scrollbar-width:thin}
  .tl-track{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(148px,1fr)}
}
.tl-rail{position:absolute;left:0;right:0;top:27px;height:1px;background:var(--line-strong)}
.tl-rail-fill{position:absolute;left:0;top:0;height:100%;background:var(--accent);width:7.14%}
.tl-item{
  position:relative;background:none;border:0;padding:0;text-align:left;
  font-family:inherit;cursor:pointer;display:flex;flex-direction:column;
}
.tl-date-top{
  position:absolute;top:-42px;left:50%;transform:translateX(-50%);
  font-size:11.5px;font-weight:500;color:var(--ink-3);white-space:nowrap;
  font-variant-numeric:tabular-nums;transition:color .2s ease;
}
.tl-item[data-status="live"] .tl-date-top,.tl-item[data-status="closing"] .tl-date-top{color:var(--ink-2);font-weight:600}
.tl-item.is-active .tl-date-top{color:var(--accent-ink);font-weight:600}
.tl-dot{
  position:absolute;top:-22px;left:50%;transform:translateX(-50%);
  width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--line-strong);
  transition:all .22s ease;
}
.tl-item[data-status="live"] .tl-dot{background:var(--accent);border-color:var(--accent)}
.tl-item.is-active .tl-dot{
  background:var(--accent);border-color:var(--accent);
  outline:4px solid var(--accent-soft);
}
.tl-card{
  display:flex;flex-direction:column;flex:1;
  border:1px solid var(--line);border-radius:12px;padding:15px 14px 14px;
  background:var(--surface);transition:border-color .2s ease,background .2s ease;
}
.tl-item:hover .tl-card{border-color:var(--line-strong);background:var(--surface-2)}
.tl-item.is-active .tl-card{
  border-color:var(--accent);background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px var(--accent);
}
.tl-head{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;row-gap:4px}
.tl-num{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--ink-4)}
.tl-item.is-active .tl-num{color:var(--accent-ink)}
.tl-name{display:block;margin-top:11px;font-size:14.5px;font-weight:600;letter-spacing:-.017em;line-height:1.25;color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--ink-4);white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--line-strong);display:block;flex:none}
.badge.live{color:var(--live)}
.badge.live i{background:var(--live)}
.badge.closing{color:var(--closing)}
.badge.closing i{background:var(--closing)}
.badge.next{color:var(--accent-ink)}
.badge.next i{background:var(--accent)}

/* ---------- DETAIL ---------- */
.detail{
  display:grid;grid-template-columns:1.48fr 1fr;gap:44px;
  padding:44px 0 60px;
}
@media(max-width:980px){.detail{grid-template-columns:1fr;gap:36px}}
.stage-anim{animation:rise .38s cubic-bezier(.22,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

.mock-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:40px 24px 30px;display:flex;flex-direction:column;align-items:center;
}
.mock-note{margin-top:22px;font-size:12.5px;color:var(--ink-3);text-align:center;max-width:44ch;line-height:1.5}
.mock-note.is-empty{margin-top:0}
.mock-note b{color:var(--ink-2);font-weight:600}

/* phone */
.phone{
  width:326px;height:678px;flex:none;border-radius:46px;background:#0E0E10;
  padding:9px;border:1px solid var(--line-strong);
}
.screen{width:100%;height:100%;border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.screen.dark{background:#0A0708}
.screen.dark:before,.screen.dark:after{content:'';position:absolute;inset:0;pointer-events:none}
.screen.dark:before{background:radial-gradient(115% 62% at 8% -6%, rgba(255,107,70,.42), rgba(255,107,70,0) 62%)}
.screen.dark:after{background:radial-gradient(85% 42% at 104% 100%, rgba(126,94,255,.30), rgba(126,94,255,0) 66%)}
.screen.light{
  background:#fff;
  --ink:#0B0B0C;--ink-2:#3E434E;--ink-3:#6C7280;--ink-4:#9AA0AB;
  --surface:#FAFAF9;--surface-2:#F3F3F1;
  --line:#E8E8E5;--line-strong:#D6D6D2;
  --accent-ink:#D33F16;--accent-soft:#FFF3EF;--accent-line:#FFD5C6;
}
.screen.video-screen{background:#000}
.mock-video{width:100%;height:100%;object-fit:cover;display:block}
.sc{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:16px 16px 14px}

/* dark assistant chrome */
.a-top{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.circ{width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center}
.circ svg{width:13px;height:13px;fill:none;stroke:rgba(255,255,255,.82);stroke-width:1.8;stroke-linecap:round}
.utter{
  margin-top:22px;text-align:right;color:#F6EFEC;font-size:21px;line-height:1.22;
  font-weight:700;letter-spacing:-.025em;
}
.a-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin-top:20px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.a-body::-webkit-scrollbar{display:none}
.a-foot{flex:none;padding-top:10px}
.a-line{color:rgba(255,255,255,.62);font-size:12.5px;line-height:1.45}
.a-line b{color:#fff;font-weight:600}
.gcard{background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:13px}
.gcard.pick{border-color:rgba(255,107,70,.55);background:rgba(255,107,70,.10)}
.row{display:flex;align-items:center;gap:10px}
.thumb{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);flex:none}
.thumb.sq{border-radius:9px}
.t1{color:#fff;font-size:13px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.t2{color:rgba(255,255,255,.52);font-size:11px;margin-top:3px;line-height:1.35}
.t3{color:#fff;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.mini{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#FFB09A}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;color:rgba(255,255,255,.78);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:4px 9px}
.chip.on{background:rgba(255,107,70,.16);border-color:rgba(255,107,70,.45);color:#FFC0AC}
.cta{
  background:var(--accent);color:#fff;border-radius:999px;
  padding:13px;text-align:center;font-size:13.5px;font-weight:600;letter-spacing:-.01em;
}
.cta.two{display:flex;justify-content:space-between;padding:13px 20px}
.cta.two span:last-child{opacity:.85;font-weight:500}
.cta-alt{margin-top:9px;text-align:center;font-size:12px;color:rgba(255,255,255,.5)}
.a-bar{margin-top:12px;display:flex;align-items:center;gap:9px}
.a-plus{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.10);display:grid;place-items:center;color:rgba(255,255,255,.8);font-size:17px;font-weight:300;flex:none}
.a-input{flex:1;height:38px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);display:flex;align-items:center;padding:0 15px;color:rgba(255,255,255,.42);font-size:12.5px}
.a-mic{width:38px;height:38px;border-radius:50%;background:#EF3D2E;display:grid;place-items:center;flex:none}
.a-mic svg{width:14px;height:14px;fill:#fff}
.homebar{width:112px;height:4px;border-radius:99px;background:rgba(255,255,255,.28);margin:11px auto 0}
.homebar.d{background:rgba(0,0,0,.20)}

/* light home mock */
.h-top{display:flex;align-items:center;justify-content:space-between;padding-top:16px}
.h-addr{font-size:12px;color:var(--ink-3)}
.h-addr b{display:block;color:var(--ink);font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.h-av{width:29px;height:29px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.h-search{margin-top:14px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;padding:0 13px;gap:9px;font-size:12.5px;color:var(--ink-4)}
.h-search svg{width:13px;height:13px;fill:var(--accent);flex:none}
.magic{
  margin-top:12px;border:1.5px solid var(--accent);background:var(--accent-soft);
  border-radius:16px;padding:14px;position:relative;
}
.magic-lbl{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink)}
.magic-lbl svg{width:11px;height:11px;fill:var(--accent)}
.magic-q{margin-top:9px;font-size:14.5px;font-weight:600;letter-spacing:-.02em;line-height:1.3;color:var(--ink)}
.magic-sub{margin-top:5px;font-size:11.5px;color:var(--ink-3)}
.verticals{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.vert{text-align:center}
.vert i{display:block;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.vert span{display:block;margin-top:6px;font-size:9.5px;color:var(--ink-3)}
.h-sec{margin-top:18px;display:flex;align-items:center;justify-content:space-between}
.h-sec h4{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.h-ai-btn{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:999px;padding:4px 9px}
.h-ai-btn svg{width:10px;height:10px;fill:var(--accent)}
.rests{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rest i{display:block;height:62px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.rest b{display:block;margin-top:7px;font-size:11.5px;font-weight:600;letter-spacing:-.01em}
.rest span{display:block;margin-top:2px;font-size:10px;color:var(--ink-4)}
.h-float{
  margin-top:auto;height:44px;border-radius:999px;background:var(--ink);
  display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 17px;
}
.h-float span{color:rgba(255,255,255,.6);font-size:12.5px}
.h-float .a-mic{width:32px;height:32px}
.pin{
  position:absolute;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:10px;font-weight:700;display:grid;place-items:center;z-index:5;
  border:2px solid #fff;
}

/* store groups (multicart) */
.store-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.store-n{display:flex;align-items:center;gap:7px;color:#fff;font-size:12px;font-weight:600}
.store-n i{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.18);display:block}
.li{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid rgba(255,255,255,.07)}
.li:first-of-type{border-top:0}
.li-n{color:rgba(255,255,255,.78);font-size:11.5px}
.li-p{color:#fff;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.save{
  border-radius:12px;background:rgba(255,107,70,.12);border:1px solid rgba(255,107,70,.35);
  padding:9px 12px;color:#FFC7B6;font-size:11.5px;line-height:1.4;
}
.save b{color:#fff;font-weight:700}

/* basket list */
.blist{display:flex;flex-direction:column}
.bitem{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.07)}
.bitem:first-child{border-top:0}
.bq{width:22px;height:22px;border-radius:7px;background:rgba(255,107,70,.18);color:#FFB09A;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.bn{flex:1;color:rgba(255,255,255,.82);font-size:11.5px}
.bp{color:rgba(255,255,255,.5);font-size:11px;font-variant-numeric:tabular-nums}

/* multicart (stage 06) */
#mc-root{flex:1;min-height:0;display:flex;flex-direction:column}
#mc-body.mc-center{justify-content:center}
.store-h{cursor:pointer}
.mc-eta{color:rgba(255,255,255,.4);font-weight:500;margin-left:6px;font-size:10px}
.mc-store-r{display:flex;align-items:center;gap:8px;flex:none}
.mc-chev{width:13px;text-align:center;color:rgba(255,255,255,.4);font-size:13px;line-height:1;flex:none}
.gcard.mc-top{border-color:rgba(255,107,70,.5);background:rgba(255,107,70,.09)}
.mc-top-tag{color:var(--accent-ink)}
.mc-items{margin-top:9px}
.mc-item .li{padding:5px 0}
.mc-ctrls{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.mc-stepper{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border-radius:999px;padding:3px 4px}
.mc-stepbtn{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center;border:0;font-family:inherit;cursor:pointer;padding:0}
.mc-stepbtn:disabled{opacity:.3;cursor:default}
.mc-qty{font-size:10.5px;color:#fff;min-width:10px;text-align:center;font-variant-numeric:tabular-nums}
.mc-tbtn{font-size:10px;font-weight:600;color:var(--accent-ink);background:none;border:0;font-family:inherit;cursor:pointer;padding:0}
.mc-tbtn.mc-x{color:rgba(255,255,255,.36)}
.mc-empty{color:rgba(255,255,255,.4);font-size:10.5px;padding:6px 0 2px}
.mc-alts{margin:0 0 9px;padding:8px 9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.mc-alts-l{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.38)}
.mc-alt{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:0;font-family:inherit;color:inherit;cursor:pointer;text-align:left;width:100%}
.mc-alt-n{color:rgba(255,255,255,.85);font-size:10.5px}
.mc-alt-p{color:#FFC0AC;font-size:10px;font-weight:600;white-space:nowrap;flex:none}
.mc-req{color:#F6EFEC;font-size:13.5px;line-height:1.32;font-weight:700;letter-spacing:-.02em;text-align:right}
.mc-groceries{display:flex;gap:6px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none;flex-shrink:0}
.mc-groceries::-webkit-scrollbar{display:none}
.mc-groceries .chip{flex:none}
.mc-status{font-size:10.5px;color:rgba(255,255,255,.4);line-height:1.4}
.mc-sub{color:rgba(255,255,255,.52);font-size:11px;line-height:1.4}
.mc-moment .mini{display:flex;align-items:center;gap:4px}
.mc-moment .mini svg{width:9px;height:9px;fill:var(--accent)}
.mc-moment-t{color:rgba(255,255,255,.82);font-size:11.5px;font-weight:600;margin-top:3px;line-height:1.35}
.mc-moment-s{color:rgba(255,255,255,.4);font-size:10px;margin-top:2px;line-height:1.3}
.mc-foot-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.mc-foot-h span:first-child{font-size:11px;color:rgba(255,255,255,.62);font-weight:500}
.mc-breakdown{margin-bottom:8px}
.mc-conf{text-align:center;padding-top:6px}
.mc-conf-badge{width:36px;height:36px;border-radius:50%;background:rgba(255,107,70,.16);display:grid;place-items:center;margin:0 auto}
.mc-conf-badge svg{width:15px;height:15px;fill:var(--accent)}
.mc-conf-t{margin-top:12px;color:#fff;font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.mc-conf-s{margin-top:5px;color:rgba(255,255,255,.5);font-size:11.5px;line-height:1.4}

/* search mock */
.s-field{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 13px;color:#fff;font-size:13px;line-height:1.35;font-weight:500}
.s-read{margin-top:11px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.38)}

/* stage 02 — stacked mocks (wow-moment card + real-flow carousel) */
.mock-panel .phone + .phone{margin-top:28px}
.rf-screen{background:#0A0708}
.rf-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0A0708}
.rf-img{width:100%;height:100%;object-fit:contain;display:block}
.rf-img.cover{object-fit:cover}
.rf-html-step{position:absolute;inset:0;display:none;flex-direction:column;background:#0A0708;overflow:hidden}
.rf-arrow{
  position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;

      <div class="mc-item">
        <div class="li">
          <div class="li-n">${it.name}</div>
          <div class="li-p">$${fmtCOP(it.price*it.qty)}</div>
        </div>
        <div class="mc-ctrls">
          <div class="mc-stepper">
            <button class="mc-stepbtn" data-action="dec" data-store="${k}" data-idx="${i}" ${it.qty<=1?'disabled':''}>−</button>
            <span class="mc-qty">${it.qty}</span>
            <button class="mc-stepbtn" data-action="inc" data-store="${k}" data-idx="${i}">+</button>
          </div>
          <button class="mc-tbtn" data-action="swap" data-store="${k}" data-idx="${i}">Cambiar</button>
          <button class="mc-tbtn mc-x" data-action="remove" data-store="${k}" data-idx="${i}">Quitar</button>
        </div>
        ${swapping ? `<div class="mc-alts">
          <div class="mc-alts-l">Alternativas</div>
          ${it.alt.map((a,ai)=>`<button class="mc-alt" data-action="pick-alt" data-store="${k}" data-idx="${i}" data-alt="${ai}">
            <span class="mc-alt-n">${a.name}</span><span class="mc-alt-p">$${fmtCOP(a.price)} · ${a.from}</span>
          </button>`).join('')}
        </div>` : ''}
      </div>`;
  }

  function storeCard(k){
    const st = state.stores[k];
    const exp = state.expanded[k];
    const top = !!state.priority && PRIORITY[state.priority].top === k;
    const n = st.items.length;

      <div class="gcard ${top?'mc-top':''}">
        <div class="store-h" data-action="toggle" data-store="${k}">
          <div class="store-n"><i></i>${st.name}<span class="mc-eta">${st.eta}</span></div>
          <div class="mc-store-r"><span class="li-p">$${fmtCOP(subtotal(k))}</span><span class="mc-chev">${exp?'−':'+'}</span></div>

      <div class="chipset">
        <div class="chip ${state.priority==='precio'?'on':''}" style="cursor:pointer" data-action="priority" data-key="precio">Priorizar precio</div>
        <div class="chip ${state.priority==='calidad'?'on':''}" style="cursor:pointer" data-action="priority" data-key="calidad">Priorizar calidad</div>
        <div class="chip ${state.priority==='rapido'?'on':''}" style="cursor:pointer" data-action="priority" data-key="rapido">Que llegue más rápido</div>
      </div>`;
    foot.innerHTML = `
      <div class="mc-foot-h">
        <span>${canastas()} canastas · ${totalItems()} productos</span>
        <button class="mc-tbtn" data-action="toggle-fold">${state.foldOpen?'Ocultar':'Ver detalle'}</button>
      </div>
      ${state.foldOpen ? `<div class="mc-breakdown">${Object.keys(state.stores).map(k=>`<div class="li"><div class="li-n">${state.stores[k].name}</div><div class="li-p">$${fmtCOP(subtotal(k))}</div></div>`).join('')}</div>` : ''}
      <div class="cta two" data-action="checkout"><span>Pagar las 4 canastas</span><span>$${fmtCOP(total())}</span></div>
      <div class="cta-alt">Un solo pago. Nosotros coordinamos las 4 órdenes.</div>`;

  function renderConfirmed(){
    body.classList.add('mc-center');
    body.innerHTML = `
      <div class="mc-conf">
        <div class="mc-conf-badge">${ICON.spark}</div>
        <div class="mc-conf-t">¡Listo! Tus 4 órdenes fueron creadas.</div>
        <div class="mc-conf-s">Te avisamos cuando cada canasta esté en camino.</div>
      </div>
      <div class="mini" style="margin-top:20px">Total pagado</div>
      <div class="li"><div class="li-n">${canastas()} canastas · ${totalItems()} productos</div><div class="li-p">$${fmtCOP(total())}</div></div>
      <div class="mini" style="margin-top:18px">Tu mercado</div>

      <div class="li"><div class="li-n">Pescadería del Barrio</div><div class="li-p">llega 2:35 PM</div></div>
      <div class="li"><div class="li-n">Éxito</div><div class="li-p">llega 2:50 PM</div></div>

    if(!btn) return;
    const action = btn.dataset.action;
    const k = btn.dataset.store;
    const idx = btn.dataset.idx !== undefined ? +btn.dataset.idx : null;

    if(action==='toggle'){
      state.expanded[k] = !state.expanded[k];
    } else if(action==='inc'){
      state.stores[k].items[idx].qty++;
    } else if(action==='dec'){
      const it = state.stores[k].items[idx];
      if(it.qty > 1) it.qty--;
    } else if(action==='remove'){
      state.stores[k].items.splice(idx,1);
      state.swap = null;
    } else if(action==='swap'){
      state.swap = (state.swap && state.swap.store===k && state.swap.idx===idx) ? null : {store:k, idx};
    } else if(action==='pick-alt'){
      const ai = +btn.dataset.alt;
      const it = state.stores[k].items[idx];
      const chosen = it.alt[ai];
      const previous = {name:it.name, price:it.base, from:state.stores[k].name};
      it.name = chosen.name; it.price = chosen.price; it.base = chosen.price; it.qty = 1;
      it.alt = it.alt.filter((_,a)=>a!==ai);
      it.alt.push(previous);
      state.swap = null;
    } else if(action==='priority'){
      const key = btn.dataset.key;
      state.priority = state.priority === key ? null : key;
      Object.values(state.stores).forEach(st=>st.items.forEach(it=>it.price=it.base));
      if(state.priority){
        const cfg = PRIORITY[state.priority];
        Object.entries(cfg.adjust).forEach(([sk,delta])=>{
          const items = state.stores[sk].items;
          if(items.length) items[0].price = Math.max(1000, items[0].base + delta);
        });
      }
    } else if(action==='toggle-fold'){
      state.foldOpen = !state.foldOpen;
    } else if(action==='checkout'){
      state.confirmed = true;
    } else if(action==='reset'){
      state = freshState();
    }
    render();
  }

  function init(){
    state = freshState();
    root = document.getElementById('mc-root');
    body = document.getElementById('mc-body');
    foot = document.getElementById('mc-foot');
    root.onclick = handleClick;
    render();
  }

  return { init };
})();

/* Generic real-flow carousel — powers Stage 02's 6-image recommendation flow,
   Stage 03's two Retail Assistant flows (2-image + 3-image), and Stage 05's
   Search (2-image) and Magic Box (image + custom HTML) flows. Each carousel
   instance is keyed by a `data-flow` id on its `.rf-screen` root, so several
   can coexist on screen simultaneously (Stage 03 stacks two) and each is
   re-initialized independently every time select(n) rebuilds #mock.
   `init(flowId, steps)` accepts either plain image-path strings (legacy
   image-only usage) or `{img:...}` / `{html:...}` step objects, so a single
   flow can mix real screenshots with a custom-built HTML screen (used by
   Stage 05's Magic Box "then it suggests AI Assistant" concept step). */
const Carousels = (() => {
  const registry = {};

  const normalizeStep = s => (typeof s === 'string') ? { img: s } : s;

  function render(flow){
    const { steps, idx, els } = flow;
    const step = steps[idx];
    if(step.html !== undefined){
      if(els.img) els.img.style.display = 'none';
      if(els.htmlStep){ els.htmlStep.style.display = 'flex'; els.htmlStep.innerHTML = step.html; }
    } else {
      if(els.img){ els.img.style.display = ''; els.img.src = step.img; }
      if(els.htmlStep){ els.htmlStep.style.display = 'none'; els.htmlStep.innerHTML = ''; }
    }
    els.count.textContent = `${idx + 1} / ${steps.length}`;
    els.dots.innerHTML = steps.map((_, i) => `<span class="rf-dot ${i===idx?'on':''}"></span>`).join('');
    els.prev.disabled = idx === 0;
    els.next.disabled = idx === steps.length - 1;
  }

  function goTo(flow, i){
    flow.idx = Math.max(0, Math.min(flow.steps.length - 1, i));
    render(flow);
  }

  function handleClick(e){
    const btn = e.target.closest('[data-rf]');
    if(!btn) return;
    const screenEl = btn.closest('.rf-screen');
    const flow = screenEl && registry[screenEl.dataset.flow];
    if(!flow) return;
    if(btn.dataset.rf === 'next') goTo(flow, flow.idx + 1);
    else if(btn.dataset.rf === 'prev') goTo(flow, flow.idx - 1);
  }

  function init(flowId, steps){
    const screenEl = document.querySelector(`.rf-screen[data-flow="${flowId}"]`);
    if(!screenEl) return;
    const flow = {
      steps: steps.map(normalizeStep), idx: 0,
      els: {
        img: screenEl.querySelector('.rf-img'),
        htmlStep: screenEl.querySelector('.rf-html-step'),
        dots: screenEl.querySelector('.rf-dots'),
        count: screenEl.querySelector('.rf-count'),
        prev: screenEl.querySelector('[data-rf="prev"]'),
        next: screenEl.querySelector('[data-rf="next"]')
      }
    };
    registry[flowId] = flow;
    screenEl.onclick = handleClick;
    render(flow);
  }

  return { init };
})();

      {t:'Best-match recommendation', d:'Find and suggest the right product when the request is broad or generic.'},

      ]
    },
    gtm:{

        {k:'New entry points', v:'New entry points added directly in the App surfacing the capability'}
      ]
    }
  },
  {
    n:4, name:'Proactive AI', date:'Sep 21', dateNote:'2026', verb:'Anticipates', status:'coming',
    capability:'AI Assistant predicts what the user could want or need — from time, habits and context — and surfaces it before being asked.',
    value:'The user no longer has to start the interaction. Recurring needs are handled before they become a task, and the decision arrives already made.',
    moment:'Your AI Assistant is one step ahead.',
    note:'<b>Stage 04 mock</b> — A proactive suggestion triggered by time and habit, not by a user query.',
    gtm:{
      channels:[
        {k:'Tooltip', v:'In-app tooltip per feature, announcing each new capability as it ships'},
        {k:'New entry points', v:'New entry points added directly in the App surfacing the capability'}
      ]
    }
  },
  {
    n:5, name:'AI Everywhere', date:'Sep 28', dateNote:'2026', verb:'Appears', status:'coming',
    capability:'AI Assistant expands into Restaurant Home and Home through Magic Box and additional contextual entry points across the app.',
    value:'The Assistant stops being a destination the user has to remember to open. It is available at the exact moment of intent, inside the surfaces where people already are.',

    capability:'AI Assistant finds products and prices across different stores and assembles one multi-store basket with a single checkout.',
    value:'The user gets the best available basket without shopping in several stores or comparing prices themselves — savings without extra effort, one payment, one delivery.',
    moment:'The best basket, across stores, in one checkout.',
    note:'<b>Stage 06 mock</b> — One basket assembled from four stores, optimized on price, quality and same-day delivery, with a single checkout.',
    gtm:{
      channels:[

    }
  },
  {
    n:7, name:'Conversational Search', date:'TBD', dateNote:'', verb:'Converses', status:'coming',
    capability:'Search becomes native AI: it understands intent, constraints and context expressed in natural language and generates the results.',
    value:'No keyword guessing and no stacking filters. The user asks the way they would ask a person, and discovery adapts to the answer.',
    moment:'Search is now conversational.',
    note:'<b>Stage 07 mock</b> — Natural-language query decomposed into explicit constraints, then resolved across verticals.',
    gtm:{
      channels:[
        {k:'Tooltip', v:'In-app tooltip per feature, announcing each new capability as it ships'},
        {k:'New entry points', v:'New entry points added directly in the App surfacing the capability'}
      ]
    }
  }
];

const LABEL = {live:'LIVE', closing:'TESTING', next:'NEXT', coming:'COMING'};
let active = 1;

/* ---- timeline ---- */
const track = document.getElementById('track');
STAGES.forEach(s=>{
  const b = document.createElement('button');
  b.className = 'tl-item';
  b.dataset.status = s.status;
  b.dataset.n = s.n;
  b.setAttribute('aria-label', `Stage ${s.n}: ${s.name}`);
  b.innerHTML = `
    <span class="tl-date-top">${s.date}</span>
    <span class="tl-dot"></span>
    <span class="tl-card">
      <span class="tl-head">
        <span class="tl-num">STAGE 0${s.n}</span>
        <span class="badge ${s.status}"><i></i>${LABEL[s.status]}</span>
      </span>
      <span class="tl-name">${s.name}</span>
    </span>`;
  b.addEventListener('click',()=>select(s.n));
  track.appendChild(b);
});

/* ---- render ---- */
const mockEl = document.getElementById('mock');
const noteEl = document.getElementById('mockNote');
const sideEl = document.getElementById('side');

function select(n){
  active = n;
  const s = STAGES[n-1];

  document.querySelectorAll('.tl-item').forEach(el=>
    el.classList.toggle('is-active', +el.dataset.n === n));

  mockEl.className = 'stage-anim';
  mockEl.innerHTML = MOCKS[n]();
  if(n===2) initRecFlow();
  if(n===3) initRetailFlows();
  if(n===5) initAIEverywhereFlows();
  if(n===6) initMultiCart();
  noteEl.className = s.note ? 'mock-note stage-anim' : 'mock-note stage-anim is-empty';
  noteEl.innerHTML = s.note;

  sideEl.className = 'side stage-anim';
  sideEl.innerHTML = `
    <div class="side-eyebrow">Stage 0${s.n}</div>
    <h2>${s.name}</h2>
    <div class="side-meta">
      <span class="side-date">${s.date}${s.dateNote?' <span>'+s.dateNote+'</span>':''}</span>
      <span class="badge ${s.status}"><i></i>${LABEL[s.status]}</span>
    </div>
    <div class="block">
      <div class="block-l">New capability</div>
      <p class="block-t">${s.capability}</p>
    </div>
    <div class="block">
      <div class="block-l">User value</div>
      <p class="block-t">${s.value}</p>
    </div>
    <div class="moment">
      <div class="moment-l">${ICON.spark} Marketable moment</div>
      <p class="moment-q">“${s.moment}”</p>
    </div>
    ${s.signal ? `<div class="stage-note-line">${s.signal}</div>` : ''}
    ${s.strategy ? `
    <div class="block">
      <div class="block-l">High-level strategy</div>
      <div class="strat-grid">
        ${s.strategy.map(p => `
        <div class="strat-item">
          <div class="strat-t">${p.t}</div>
          ${p.d ? `<div class="strat-d">${p.d}</div>` : ''}
        </div>`).join('')}
      </div>
    </div>` : ''}
    ${s.scope ? `
    <div class="block">
      <div class="block-l">In scope (v1)</div>
      <div class="scope-note">${s.scope.note}</div>
      <ol class="scope-list">
        ${s.scope.items.map((item,i) => `
        <li class="scope-item">
          <span class="scope-n">${i+1}</span>
          <span class="scope-t">${item}</span>
        </li>`).join('')}
      </ol>
    </div>` : ''}
    ${s.gtm ? `
    <div class="block">
      <div class="block-l">GTM plan</div>
      <table class="gtm-table">
        ${s.gtm.rollout ? `
        <tr class="gtm-sec"><td colspan="2">Rollout</td></tr>
        ${s.gtm.rollout.map(r => `<tr><td class="gtm-k">${r.k}</td><td>${r.v}</td></tr>`).join('')}
        ` : ''}
        ${(s.gtm.country || s.gtm.who) ? `
        <tr class="gtm-sec"><td colspan="2">Audience</td></tr>
        ${s.gtm.country ? `<tr><td class="gtm-k">Country</td><td>${s.gtm.country}</td></tr>` : ''}
        ${s.gtm.who ? `<tr><td class="gtm-k">User base</td><td>${s.gtm.who}</td></tr>` : ''}
        ${s.gtm.marketSize ? `<tr><td class="gtm-k">Market size</td><td>${s.gtm.marketSize}</td></tr>` : ''}
        ` : ''}
        ${s.gtm.channels ? `
        <tr class="gtm-sec"><td colspan="2">Channels</td></tr>
        ${s.gtm.channels.map(c => `<tr><td class="gtm-k">${c.k}</td><td>${c.v}</td></tr>`).join('')}
        ` : ''}
      </table>
      ${s.gtm.example ? `
      <div class="gtm-example">
        <div class="phone onboard">
          <div class="screen video-screen">
            <div class="vb-app"></div>
            <div class="vb-addr"><span>${s.gtm.example.address}</span><i>⌄</i></div>
            <div class="vb-scrim"></div>
            <div class="vb-close">×</div>
            <div class="vb-card">
              <video class="vb-video" src="${s.gtm.example.src}" autoplay muted loop playsinline ontimeupdate="vbTick(this)" onloadedmetadata="vbTick(this)"></video>
              <div class="vb-fade"></div>
              <div class="vb-progress">
                <div class="vb-track"><div class="vb-fill"></div></div>
                <span class="vb-time">0:00</span>
              </div>
            </div>
            <button class="vb-skip">Saltar video <span>›</span></button>
            <div class="vb-mic">${ICON.mic}</div>
          </div>
        </div>
        <div class="gtm-example-r">
          <div class="gtm-example-eyebrow">Channel example</div>
          <p class="gtm-example-t">Native video In-App onboarding — teaches the user the voice shortcut in a few seconds.</p>
          <a class="vb-link" href="${s.gtm.example.figma}" target="_blank" rel="noopener">View complete flow <span>→</span></a>
        </div>
      </div>` : ''}
      ${s.gtm.ideas ? `
      <div class="gtm-idea">
        <div class="gtm-idea-l">Ideas to discuss</div>
        ${s.gtm.ideas.map(i => `
        <div class="gtm-idea-item">
          <p class="gtm-idea-t">${i.text}</p>
          ${i.image ? `
          <div class="gtm-idea-ref">
            <img src="${i.image}" alt="${i.caption||''}">
            <span>${i.caption||''}</span>
          </div>` : ''}
        </div>`).join('')}
      </div>` : ''}
    </div>` : ''}`;

  void mockEl.offsetWidth;

  const el = document.querySelector(`.tl-item[data-n="${n}"]`);
  if(el) el.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
}

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight' && active < STAGES.length) select(active+1);
  if(e.key==='ArrowLeft'  && active > 1) select(active-1);
});

select(1);
</script>
</body>
</html>
